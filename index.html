<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Portfolio</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
            /* enables smooth snapping */
        }

        /* The container determines how long the user scrolls to finish the animation */
        .animation-container {
            height: 400vh;
            /* Reduced from 600vh for better pacing */
            position: relative;
        }

        .sticky-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            /* This ensures the image covers the entire screen, leaving no blank space */
            z-index: 1;
        }

        /* ========================================= */
        /* SCENE OVERLAY SYSTEM                      */
        /* ========================================= */
        .scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            /* Above canvas */
            pointer-events: none;
            /* Let scroll pass through */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: absolute;
            width: 90%;
            max-width: 800px;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.6s ease-out, transform 0.6s ease-out;
            pointer-events: auto;
            /* Enable clicks inside the scene */
        }

        .scene.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* ========================================= */
        /* LOADING & UTILS                           */
        /* ========================================= */
        .loading-container {
            position: absolute;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            transition: opacity 0.5s ease;
        }

        .loading-text {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 3px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .progress-bar {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: #ffffff;
            transition: width 0.1s;
        }

        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .scroll-indicator.visible {
            opacity: 0.7;
        }

        .scroll-indicator p {
            font-size: 0.8rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .mouse {
            width: 24px;
            height: 36px;
            border: 2px solid white;
            border-radius: 12px;
            position: relative;
        }

        .wheel {
            width: 4px;
            height: 6px;
            background: white;
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            animation: scroll-mouse 1.5s infinite;
        }

        @keyframes scroll-mouse {
            0% {
                top: 6px;
                opacity: 1;
            }

            100% {
                top: 20px;
                opacity: 0;
            }
        }

        .progress-rail {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .progress-rail::before {
            content: '';
            position: absolute;
            top: 10px;
            bottom: 10px;
            width: 1px;
            background: rgba(255, 255, 255, 0.15);
            z-index: -1;
        }

        .progress-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .progress-dot.active {
            background: #ffffff;
            transform: scale(1.5);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
        }

        .debug-inspector {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: #0f0;
            padding: 15px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 14px;
            z-index: 9999;
            border: 1px solid #0f0;
            pointer-events: none;
            display: none;
            /* toggled via js */
        }
    </style>

<body>

    <div class="animation-container">
        <div class="sticky-wrapper">
            <div class="loading-container" id="loadingContainer">
                <div class="loading-text" id="loadingText">Loading Frames 0%</div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <canvas id="animationCanvas"></canvas>

            <!-- DEBUG UI -->
            <div id="debugInspector" class="debug-inspector">
                <div>Frame: <span id="debugFrame">0</span> / 295</div>
                <div>Scene: <span id="debugScene">Hero</span></div>
            </div>

            <!-- PROGRESS RAIL -->
            <div class="progress-rail" id="progressRail">
                <!-- Dots generated by JS -->
            </div>

            <!-- SCENE OVERLAYS -->
            <div class="scene-overlay" id="sceneOverlay">
                <!-- 01 HERO -->
                <div class="scene" id="scene-hero"></div>

                <!-- 02 ABOUT ME -->
                <div class="scene" id="scene-about"></div>

                <!-- 03 SKILLS -->
                <div class="scene" id="scene-skills"></div>

                <!-- 04 PROJECTS -->
                <div class="scene" id="scene-projects"></div>

                <!-- 05 AWARDS / CERTIFICATIONS -->
                <div class="scene" id="scene-certifications"></div>

                <!-- 06 EDUCATION -->
                <div class="scene" id="scene-education"></div>

                <!-- 07 EXPERIENCE -->
                <div class="scene" id="scene-experience"></div>

                <!-- 08 FEEDBACK & VIEWER COUNT -->
                <div class="scene" id="scene-feedback"></div>

                <!-- 09 FOOTER / CONTACT -->
                <div class="scene" id="scene-footer"></div>
            </div>

            <div class="scroll-indicator" id="scrollIndicator">
                <p>Scroll Down</p>
                <div class="mouse">
                    <div class="wheel"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. CENTRALIZED CONFIGURATION (SNAP POINTS)
        // ==========================================
        // These numbers represent the exact frame index (0-294) you want each scene to snap to.
        // Change these to tune the exact visual moment each scene lands on.
        const SCENES = [
            { id: "scene-hero", label: "Hero", snapFrame: 0 },
            { id: "scene-about", label: "About Me", snapFrame: 36 },
            { id: "scene-skills", label: "Skills", snapFrame: 62 },
            { id: "scene-projects", label: "Projects", snapFrame: 105 },
            { id: "scene-certifications", label: "Awards & Certifications", snapFrame: 160 },
            { id: "scene-education", label: "Education", snapFrame: 216 },
            { id: "scene-experience", label: "Experience", snapFrame: 230 },
            { id: "scene-feedback", label: "Feedback & Viewer Count", snapFrame: 259 },
            { id: "scene-footer", label: "Footer / Contact", snapFrame: 294 }
        ];

        // ==========================================
        // 2. EXISTING ANIMATION ENGINE
        // ==========================================
        const canvas = document.getElementById("animationCanvas");
        const context = canvas.getContext("2d");
        const loadingContainer = document.getElementById("loadingContainer");
        const loadingText = document.getElementById("loadingText");
        const progressFill = document.getElementById("progressFill");
        const scrollIndicator = document.getElementById("scrollIndicator");

        const frameCount = 295;
        const currentFrame = index => `frames/ezgif-frame-${index.toString().padStart(3, '0')}.jpg`;

        const images = [];
        let loadedImages = 0;
        let lastDrawnIndex = -1;

        // Ensure canvas stays sharp on high DPI screens
        function setupCanvas(img) {
            canvas.width = img.width;
            canvas.height = img.height;
            context.drawImage(img, 0, 0);
        }

        for (let i = 1; i <= frameCount; i++) {
            const img = new Image();
            img.src = currentFrame(i);

            img.onload = () => {
                loadedImages++;

                // Update progress
                const progress = Math.round((loadedImages / frameCount) * 100);
                loadingText.innerText = `Loading Frames ${progress}%`;
                progressFill.style.width = `${progress}%`;

                if (loadedImages === 1) {
                    setupCanvas(img);
                    lastDrawnIndex = 0;
                }

                // When fully loaded
                if (loadedImages === frameCount) {
                    setTimeout(() => {
                        loadingContainer.style.opacity = '0';
                        setTimeout(() => {
                            loadingContainer.style.display = 'none';
                            scrollIndicator.classList.add('visible');

                            // Initialize first scene
                            updateActiveScene(0);
                        }, 500);
                    }, 500);
                }
            };
            images.push(img);
        }

        // ==========================================
        // 3. SCROLL & SNAP MECHANICS
        // ==========================================
        let snapTimeout;
        let isSnapping = false;
        let activeSceneIndex = 0;



        // Progress Rail Init
        const progressRail = document.getElementById("progressRail");
        SCENES.forEach((scene, i) => {
            const dot = document.createElement("div");
            dot.className = "progress-dot";
            dot.id = `dot-${i}`;
            progressRail.appendChild(dot);
        });

        // Keyboard Navigation
        window.addEventListener("keydown", (e) => {
            if (["input", "textarea"].includes(document.activeElement.tagName.toLowerCase())) return;

            if (e.key === "ArrowDown" || e.key === "ArrowUp") {
                e.preventDefault();

                let targetIndex = activeSceneIndex;
                if (e.key === "ArrowDown" && activeSceneIndex < SCENES.length - 1) {
                    targetIndex++;
                } else if (e.key === "ArrowUp" && activeSceneIndex > 0) {
                    targetIndex--;
                }

                if (targetIndex !== activeSceneIndex) {
                    const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;
                    executeSnap(SCENES[targetIndex].snapFrame, maxScrollTop);
                }
            }
        });

        window.addEventListener('scroll', () => {
            const scrollTop = document.documentElement.scrollTop;
            const maxScrollTop = document.documentElement.scrollHeight - window.innerHeight;

            // Hide scroll indicator once user starts scrolling
            if (scrollTop > 50) {
                scrollIndicator.classList.remove('visible');
            }

            const scrollFraction = Math.max(0, Math.min(1, scrollTop / maxScrollTop));
            const frameIndex = Math.min(
                frameCount - 1,
                Math.floor(scrollFraction * frameCount)
            );

            requestAnimationFrame(() => {
                updateImage(frameIndex);
                updateActiveScene(frameIndex);
            });

            // Handle Snap Logic
            if (!isSnapping) {
                clearTimeout(snapTimeout);
                snapTimeout = setTimeout(() => {
                    executeSnap(frameIndex, maxScrollTop);
                }, 200); // Wait 200ms after scrolling stops before snapping
            }
        });

        function updateImage(index) {
            // Find the closest loaded image if the exact one isn't ready
            let targetIndex = index;
            while (targetIndex >= 0 && (!images[targetIndex] || !images[targetIndex].complete)) {
                targetIndex--;
            }

            if (targetIndex >= 0 && targetIndex !== lastDrawnIndex) {
                const img = images[targetIndex];
                context.drawImage(img, 0, 0, canvas.width, canvas.height);
                lastDrawnIndex = targetIndex;
            }
        }

        function updateActiveScene(currentFrameIndex) {
            // Find which scene is closest to the current frame
            let closestSceneIndex = 0;
            let minDistance = Infinity;

            SCENES.forEach((scene, index) => {
                const distance = Math.abs(currentFrameIndex - scene.snapFrame);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestSceneIndex = index;
                }
            });

            activeSceneIndex = closestSceneIndex;
            const closestScene = SCENES[activeSceneIndex];

            // Update DOM classes for fade in/out
            document.querySelectorAll('.scene').forEach(el => {
                if (el.id === closestScene.id) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });

            // Update Progress Dots
            document.querySelectorAll('.progress-dot').forEach((dot, index) => {
                if (index === activeSceneIndex) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });

            // Update Debug UI
            if (debugInspector.style.display === 'block') {
                debugFrame.innerText = currentFrameIndex;
                debugScene.innerText = closestScene.label;
            }
        }

        function executeSnap(currentFrameIndex, maxScrollTop) {
            // Find the closest scene to snap to
            let closestScene = SCENES[0];
            let minDistance = Infinity;

            SCENES.forEach(scene => {
                const distance = Math.abs(currentFrameIndex - scene.snapFrame);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestScene = scene;
                }
            });

            // Calculate the exact pixel scroll position for this scene's frame
            const targetScrollFraction = closestScene.snapFrame / frameCount;
            const targetScrollTop = targetScrollFraction * maxScrollTop;

            // Only snap if we are not already perfectly there (prevent loop)
            if (Math.abs(document.documentElement.scrollTop - targetScrollTop) > 5) {
                isSnapping = true;
                window.scrollTo({
                    top: targetScrollTop,
                    behavior: 'smooth'
                });

                // Re-enable snapping logic after the smooth scroll animation completes
                setTimeout(() => {
                    isSnapping = false;
                }, 600);
            }
        }

        // Handle resize
        window.addEventListener('resize', () => {
            if (lastDrawnIndex >= 0) {
                setupCanvas(images[lastDrawnIndex]);
            }
        });
    </script>
</body>

</html>
